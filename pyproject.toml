[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qpcr-workbench"
dynamic = ["version"]
description = "Local browser workbench for qPCR Ct/Cq exports: import, normalization, statistics and figures"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Joep Vondervoort" }]
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7,<3",
    "openpyxl>=3.1,<4",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
qpcr-workbench = "backend.__main__:main"

[tool.hatch.version]
path = "backend/__init__.py"

# Builds frontend/dist and ships it inside the wheel, so installing needs no Node.js.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
exclude = ["backend/test_*.py"]

# Explicit allow-list: research workbooks and local data in the checkout never enter an archive.
[tool.hatch.build.targets.sdist]
only-include = ["backend", "frontend", "docs", "hatch_build.py", "README.md", "INSTALL.md"]
exclude = ["frontend/node_modules", "frontend/dist"]

[tool.pytest.ini_options]
testpaths = ["backend"]
